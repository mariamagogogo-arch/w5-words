  function storageNotice() { return '<p class="storage">' + (saveError ? '此浏览器无法保存进度，请保持页面打开或换到允许保存数据的浏览器。' : '学习进度只保存在当前设备、当前浏览器。') + '</p>'; }
  function homeView() {
    const entries = Object.values(state.progress), due = WORD_ITEMS.filter(item => (!chosenUnit || item.unit === chosenUnit) && state.progress[item.id] && state.progress[item.id].due <= date);
    const current = chosenUnit ? dailySession() : null;
    const saved = current && current.hadWork ? current : null;
    const left = WORD_ITEMS.filter(item => item.unit === state.unit && !state.progress[item.id]).length;
    return top('五上英语 · 自己记住') + '<div class="eyebrow">少量新学，及时复习</div><h1>不靠提示，<br>也能写出来。</h1><p class="intro">我会先看看你会不会。不会的陪你记，写错的帮你找原因；之后再换个时间，看看你还记不记得。</p><section class="card"><h2>今天的默写</h2><div class="row"><div><strong>先复习到期内容</strong><small>学过的先复习，再学少量新的。</small></div><span class="status">' + due.length + ' 项到期</span></div><div class="row"><div><strong>再学新词和句子</strong><small>通常最多 5 个新词（含短语）和 1 条句子；复习多时减少新学。</small></div></div>' + ('<label class="unit">先选择本次练习单元<select id="unit-select" aria-label="选择练习单元"><option value=""' + (!chosenUnit ? ' selected' : '') + '>请选择单元</option>' + [1, 2, 3, 4, 5, 6].map(unit => '<option value="' + unit + '"' + (chosenUnit === unit ? ' selected' : '') + '>Unit ' + unit + '</option>').join('') + '</select></label>') + (chosenUnit ? button('start', saved && saved.done ? '看看这个单元今天的收获' : saved && saved.current ? '继续这个单元的练习' : '开始这个单元的默写') : '<button type="button" class="primary" disabled>请先选择单元</button>') + '<p class="small">建议每次约 10–15 分钟，觉得累了可以暂停。' + (left === 0 && !saved ? '当前单元都已接触，可选择下一个单元。' : '') + '</p></section><div class="stats"><div class="card"><strong>' + entries.filter(entry => entry.level >= 3).length + '</strong><span class="small">多日独立写对</span></div><div class="card"><strong>' + entries.filter(entry => entry.level === 0).length + '</strong><span class="small">需要巩固</span></div></div>' + storageNotice();
  }
  function questionHeader(item, task) {
    return '<span class="tag">Unit ' + item.unit + ' · ' + (item.kind === 'word' ? item.en.includes(' ') ? '短语' : '单词' : '句子') + ' · ' + (task.retest ? '穿插后再测' : '先试着回忆') + '</span>' + (item.context ? '<div class="context">前一句的意思：' + escape(item.context) + '</div>' : '') + '<div class="prompt">' + escape(item.zh) + '</div>';
  }
  function studyView(item, task) {
    const showCopy = task.phase === 'copy';
    return '<h2>' + (showCopy ? '这次先完成订正' : '一起记清楚，再遮住写') + '</h2>' + '<p class="intro">' + escape(task.reason || '先把意思和英文联系起来。') + '</p><div class="english">' + escape(item.en) + '</div>' + button('listen', '听英文，跟着读一遍', false) + '<div class="chunks">' + chunks(item).map(chunk => '<span>' + escape(chunk) + '</span>').join('') + '</div><p class="small">' + (item.kind === 'word' ? '以上是看字母顺序的记忆分段，不是音标；正式写法以上面的完整英文为准。' : '先按这些语句或意群理解，再把整条内容连起来。') + '</p><div class="study-note">' + escape(spellingTip(item)) + '</div>' + (task.previous ? '<details open><summary>看看刚才哪里不同</summary><div class="diff">' + differences(task.previous, item.en) + '</div><p class="small">红色划掉的是多写或错写的部分，绿色是需要补上或改正的部分。</p></details>' : '') + (showCopy ? '<p class="small">看着正确答案写一次，只算订正，不算独立掌握。</p>' + inputView(task, item, true) : button('hide', '遮住答案，自己写一次'));
  }
  function inputView(task, item, copying = false) {
    return '<form id="answer-form" autocomplete="off"><label for="answer" class="small">' + (copying ? '对照上面的英文，认真订正' : task.phase === 'recall' ? '答案已经遮住，试着完整写出来' : '只看中文，完整写出英文；单词、空格和大小写都要检查') + '</label><input id="answer" class="answer' + (task.blocked ? ' correct' : '') + '" value="' + escape(task.input) + '" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" maxlength="250" aria-label="填写英文答案"' + (task.blocked ? ' disabled' : '') + '>' + (!task.blocked ? '<button class="primary" type="submit">检查这一次</button>' : '') + '</form>';

  function practiceView() {

  function summaryView() {

  }
  function sessionFitsUnit(saved, unit) {

  }
  function dailySession() {

  }
  function recordEvent(kind, detail = {}) {

  function progressView() {
    const phaseName = event => event.phase === 'copy' ? '对照订正' : event.phase === 'recall' ? '遮住答案回忆' : event.retest ? '穿插复测' : '首次默写';

      const firstAnswers = new Map();

      const detailSummary = detailed ? '<p>已提交 ' + answered + ' 项，累计 ' + answers.length + ' 次作答；首次默写正确率 ' + (firstAnswers.size ? Math.round(firstRight / firstAnswers.size * 100) + '%（' + firstRight + '/' + firstAnswers.size + '）' : '暂无') + '。</p><p>' + (wrong.length ? '曾写错：' + wrong.map(id => escape(INDEX[id] ? INDEX[id].en : id)).join('、') : '暂无写错记录') + '</p>' : '<p class="small">这是更新前的汇总，未保存逐次作答，无法补回当时的输入和时间。</p>';

      return '<article class="card"><h3>' + label + '</h3>' + summary + detailSummary + '<details><summary>查看每题作答与订正过程</summary>' + (milestones ? '<ul>' + milestones + '</ul>' : '') + details + '</details></article>';
    }).join('') + '</section>').join('');
    return top('按日期查看练习') + '<h1>学习记录</h1><p class="intro">看看每天练了什么、哪里写错，以及怎样订正。</p>' + button('mastery', '查看逐词掌握与复习安排', false) + '<p class="small">详细过程从本次更新后开始保存；首次默写正确率只统计实际提交的首次答案，不包含点“还不会”的内容。</p>' + (cards || '<section class="card"><p>还没有练习记录。先从首页选择一个单元开始吧。</p></section>') + storageNotice() + button('home', '返回首页选择单元');
  }

  function masteryView() {
    const learned = WORD_ITEMS.filter(item => state.progress[item.id]);
    return top('逐词、逐句记录') + '<h1>记住多久，<br>比做过多少更重要。</h1><p class="intro">先无提示写，再隔天复测。只有不同日期独立写对，复习间隔才会变长。</p><section class="card">' + (learned.length ? learned.map(item => { const entry = progress(item.id); return '<div class="row"><div><strong>' + escape(item.zh) + '</strong><small>' + escape(item.en) + ' · Unit ' + item.unit + '<br>不同日期独立写对 ' + entry.dates.length + ' 次 · 下次 ' + entry.due + (entry.error ? '<br>最近需注意：' + escape(entry.error) : '') + '</small></div><span class="status">' + (entry.level >= 3 ? '多日独立写对' : entry.level ? '继续巩固' : '需要再练') + '</span></div>'; }).join('') : '<p class="intro">开始练习后，这里就会有记录。</p>') + '</section><p class="small">旧版的星星和错题记录没有删除。旧错词会优先重新测；旧版游戏得分不换算为已掌握。</p>' + button('home', '回到今天的默写');
  }
  function render() {
    if (!root) return;
    root.innerHTML = page === 'practice' && session && session.current ? practiceView() : page === 'summary' && session ? summaryView() : page === 'progress' ? progressView() : page === 'mastery' ? masteryView() : homeView();
    if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
  }
  function stopSpeech() { if (window.speechSynthesis) window.speechSynthesis.cancel(); }

    recordEvent('listen');

  function handleAction(event) {

    else if (action === 'progress') page = 'progress';
    else if (action === 'mastery') page = 'mastery';

  function boot() {
    root = document.getElementById('app'); date = dayString(); state = load(); chosenUnit = null; page = 'home'; migrateLegacy();

else WordLearning.boot();
</script></body></html>
